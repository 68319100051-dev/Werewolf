# ตั้งค่าสำหรับเอาขึ้น Render (Blueprint): สร้างเว็บเซอร์วิสฟรี 1 ตัว
services:
  - type: web
    name: werewolf
    runtime: node
    plan: free
    region: singapore # ใกล้ไทยที่สุด เล่นแล้วไม่หน่วง
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
