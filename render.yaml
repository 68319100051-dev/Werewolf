# ตั้งค่าสำหรับเอาขึ้น Render (Blueprint): สร้างเว็บเซอร์วิสฟรี 1 ตัว
services:
  - type: web
    name: werewolf
    runtime: node
    plan: free
    region: singapore # ใกล้ไทยที่สุด เล่นแล้วไม่หน่วง
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # กุญแจลงลายเซ็นกระเป๋าเงิน (Render สุ่มให้เอง ห้ามเปลี่ยน ไม่งั้นกระเป๋าเดิมของทุกคนใช้ไม่ได้)
      - key: WALLET_SECRET
        generateValue: true
    # ไมค์ข้ามเน็ต: ใส่ CF_TURN_KEY_ID และ CF_TURN_KEY_TOKEN ในหน้า Environment ของเซอร์วิสบน Render เอง
    # (ไม่ใส่ = ใช้ STUN อย่างเดียว ดูรายละเอียดใน server/ice.js)
